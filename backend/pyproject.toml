# Tool configuration only (the backend is not packaged).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette now prefers the `httpx2` package for TestClient; plain httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["media"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
